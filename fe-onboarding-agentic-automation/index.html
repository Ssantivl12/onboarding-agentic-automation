<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30X · Onboarding</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-brand">
        <span class="logo">30X</span>
        <span class="brand-sep">·</span>
        <span class="brand-name">Onboarding</span>
      </div>
      <button id="btn-new-session" class="btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Nueva sesión
      </button>
    </header>

    <main id="messages" class="messages">
      <div class="welcome">
        <p>Hola. Soy el agente de onboarding de 30X.</p>
        <p>Preguntame lo que necesités sobre el equipo, los programas o las herramientas.</p>
      </div>
    </main>

    <footer class="input-area">
      <div class="input-wrapper">
        <textarea
          id="input"
          placeholder="Escribí tu pregunta…"
          rows="1"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button id="btn-send" class="btn-send" title="Enviar (Enter)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Enter para enviar · Shift+Enter para nueva línea</p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
